SOC_ID=sm8150
SOC_MARKETING="Snapdragon 855/855+"
SOC_FLAVORS="halium mainline"
SOC_TIER="full-halium"
MAINLINE_KERNEL_REPO=https://gitlab.com/sm8150-mainline/linux
MAINLINE_KERNEL_REF=sm8150/6.14
MAINLINE_DEFCONFIG=defconfig
# Base config maintained by postmarketOS for this SoC's mainline kernel
MAINLINE_CONFIG_URL="https://gitlab.com/postmarketOS/pmaports/-/raw/master/device/testing/linux-postmarketos-qcom-sm8150/config-postmarketos-qcom-sm8150.aarch64"
# Android 13 (LineageOS 20) kernel: matches the vendor partition LineageOS 20 installs
HALIUM_KERNEL_REPO=https://github.com/LineageOS/android_kernel_oneplus_sm8150
HALIUM_KERNEL_REF=lineage-20
HALIUM_ANDROID_VERSION=13
HALIUM_DEFCONFIG=vendor/sm8150-perf_defconfig
# DTC_EXT: overlays (/plugin/) need a modern dtc, as in the LineageOS build
HALIUM_MAKE_FLAGS="BRAND_SHOW_FLAG=oneplus TARGET_PRODUCT=msmnile DTC_EXT=/usr/bin/dtc"
HALIUM_KERNEL_IMAGE=Image-dtb
HALIUM_SEPARATED_DTBO=true
BOOTIMG_HEADER_VERSION=2
BOOTIMG_PAGESIZE=4096
BOOTIMG_BASE=0x00000000
BOOTIMG_KERNEL_OFFSET=0x00008000
BOOTIMG_RAMDISK_OFFSET=0x01000000
BOOTIMG_TAGS_OFFSET=0x00000100
BOOTIMG_DTB_OFFSET=0x01f00000
