SOC_ID=sm8650
SOC_MARKETING="Snapdragon 8 Gen 3"
SOC_FLAVORS="halium"
# Experimental: upstream Linux has the SoC but no OnePlus board device tree.
# These phones use GKI kernels (boot + vendor_boot, header v4).
SOC_TIER="experimental"
MAINLINE_KERNEL_REPO=https://gitlab.com/linux-kernel/stable
MAINLINE_KERNEL_REF=v6.18.54
MAINLINE_DEFCONFIG=defconfig
HALIUM_KERNEL_REPO=
HALIUM_KERNEL_REF=
HALIUM_ANDROID_VERSION=14
HALIUM_DEFCONFIG=gki_defconfig
BOOTIMG_HEADER_VERSION=4
BOOTIMG_PAGESIZE=4096
BOOTIMG_BASE=0x00000000
BOOTIMG_KERNEL_OFFSET=0x00008000
BOOTIMG_RAMDISK_OFFSET=0x01000000
BOOTIMG_TAGS_OFFSET=0x00000100
BOOTIMG_DTB_OFFSET=0x01f00000
