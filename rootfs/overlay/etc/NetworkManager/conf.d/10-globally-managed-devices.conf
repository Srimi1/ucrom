# ucrom: let NetworkManager manage every network device.
# Ubuntu's /usr/lib/NetworkManager/conf.d/10-globally-managed-devices.conf
# leaves everything but Wi-Fi and mobile data "unmanaged" (netplan is meant
# to hand the rest over). ucrom has no netplan, and a phone also needs USB
# Ethernet adapters and USB tethering to just work. This empty file of the
# same name overrides Ubuntu's.
