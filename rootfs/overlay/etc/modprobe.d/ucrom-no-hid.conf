# ucrom is touch-only: HID keyboards and mice (USB, Bluetooth, userspace HID)
# must never get a driver. (hid_multitouch stays allowed: some phones wire
# their touchscreen through I2C-HID. USB/BT ones are blocked by udev.)
# "install ... /bin/false" also defeats explicit
# modprobe calls, which a plain blacklist does not.
blacklist usbhid
blacklist hid_generic
blacklist hidp
blacklist uhid
blacklist usbkbd
blacklist usbmouse
blacklist hid_apple
blacklist hid_logitech_dj
blacklist hid_logitech_hidpp
blacklist hid_microsoft
install usbhid /bin/false
install hid_generic /bin/false
install hidp /bin/false
install uhid /bin/false
install usbkbd /bin/false
install usbmouse /bin/false
