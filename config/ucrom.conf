# ucrom build configuration. Sourced by scripts/*.sh (shell syntax).
UCROM_NAME="ucrom"
UCROM_VERSION="0.1"
UCROM_CODENAME="touch"
# Ubuntu base
UCROM_SUITE="noble"
UCROM_ARCH="arm64"
UCROM_MIRROR="http://ports.ubuntu.com/ubuntu-ports"
UCROM_COMPONENTS="main,restricted,universe,multiverse"
# Phone user. The PIN is the login password (numeric, typed on the PIN pad).
UCROM_USER="ucrom"
UCROM_USER_FULLNAME="ucrom"
UCROM_PIN="147258"
UCROM_HOSTNAME="ucrom"
UCROM_LOCALE="en_US.UTF-8"
UCROM_TIMEZONE="Etc/UTC"
# Node.js for AI CLI agents (Claude Code needs >= 22)
UCROM_NODE_VERSION="22.23.3"
UCROM_NODE_SHA256="a44aeb94849a299b22df10b9e622ec2f605c2183501bc40590705131de7c740f"
# Image sizes
UCROM_ROOTFS_SIZE="8G"
# Set to 1 to preinstall proprietary AI apps (personal builds only)
UCROM_PREINSTALL_AI="${UCROM_PREINSTALL_AI:-0}"
