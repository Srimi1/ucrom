# OnePlus 7T Pro, including the McLaren Edition (India HD1911, EU HD1913, NA HD1910)
DEVICE_CODENAME=hotdog
DEVICE_NAME="OnePlus 7T Pro / 7T Pro McLaren Edition"
DEVICE_MODELS="HD1910 HD1911 HD1913"
DEVICE_SOC=sm8150
DEVICE_FLAVOR=halium
DEVICE_TIER=primary
DEVICE_SCREEN_W=1440
DEVICE_SCREEN_H=3120
DEVICE_REFRESH_RATES="60 90"
DEVICE_SCALE=3.5
# A/B slots, dynamic "super" partition holding system/vendor/odm/product
DEVICE_AB=true
DEVICE_SUPER=true
DEVICE_BOOT_PARTITION_SIZE=100663296
DEVICE_DTBO_PARTITION_SIZE=25165824
# LineageOS 20 must be installed first: ucrom reuses its vendor/odm/firmware
DEVICE_LINEAGE_CODENAME=hotdog
DEVICE_LINEAGE_VERSION=20
# From LineageOS sm8150-common BoardConfigCommon.mk, plus ucrom/halium options.
# No console= on the phone: there is no keyboard and no text console.
DEVICE_HALIUM_CMDLINE="androidboot.hardware=qcom androidboot.memcg=1 androidboot.usbcontroller=a600000.dwc3 androidboot.vbmeta.avb_version=1.0 loop.max_part=7 lpm_levels.sleep_disabled=1 msm_rtb.filter=0x237 service_locator.enable=1 swiotlb=2048 cgroup.memory=nokmem,nosocket rootfstype=ext4 datapart=/dev/disk/by-partlabel/userdata ucrom.rootfs=ucrom-rootfs.img"
# Mainline fallback (partial hardware, see docs/DEVICES.md)
DEVICE_MAINLINE_DTB=qcom/sm8150-oneplus-hotdog
DEVICE_MAINLINE_DTS_PATCH=dts/sm8150-oneplus-hotdog.dts
DEVICE_MAINLINE_CMDLINE="clk_ignore_unused pd_ignore_unused root=PARTLABEL=userdata rootwait rw quiet"
DEVICE_FIRMWARE_REPO=https://gitlab.com/sm8150-mainline/firmware-oneplus-sm8150
# Hardware ucrom drives on this phone (checked by Hardware Check)
DEVICE_FEATURES="touch display gpu refresh90 wifi bluetooth calls sms data audio earpiece mic headset camera-rear camera-front popup-camera fingerprint-fod proximity light accel gyro compass vibration flashlight nfc gps battery charging alert-slider buttons"
# In-display fingerprint sensor (panel pixels), from LineageOS config_udfps_sensor_props
DEVICE_FOD_X=720
DEVICE_FOD_Y=2728
DEVICE_FOD_R=132
